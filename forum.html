<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Fórum</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#2a1215] via-[#181a1f] to-[#111827] text-[#c9d1d9] font-sans min-h-screen flex flex-col justify-between">

    <!-- Felső navigációs sáv (DawnMTA stílus) -->
    <header id="main-header" class="bg-[#1b1d23] border-b border-[#2b2d35] px-6 py-4 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center">
            <!-- Bal oldal: Logó és Név -->
            <div class="flex items-center gap-3">
                <a href="#" onclick="switchView('login'); return false;" class="flex items-center gap-2.5 font-bold text-white text-base tracking-wide">
                    <img src="logo.png" alt="SEELMTA Logo" class="w-8 h-8 object-contain">
                    <span class="text-xl tracking-tight">SEELMTA</span>
                </a>
            </div>

            <!-- Közép: Kereső mező -->
            <div class="relative w-full md:w-80 my-2 md:my-0">
                <input type="text" placeholder="Keresés..." class="w-full bg-[#13151b] text-zinc-300 border border-[#31232d] rounded px-4 py-1.5 text-xs focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- Alsó rész: Menüsor és jobb oldali elemek -->
        <div class="max-w-7xl mx-auto mt-3 pt-3 border-t border-[#2b2d35] flex flex-wrap justify-between items-center text-xs font-semibold tracking-wider">
            <nav class="flex items-center gap-6">
                <a href="#" onclick="switchView('forum'); return false;" class="text-emerald-400 hover:text-emerald-300 transition-colors">FÓRUMOK</a>
                <a href="#" class="text-zinc-400 hover:text-white transition-colors">UCP</a>
                <a href="#" class="text-zinc-400 hover:text-white transition-colors">Prémium Shop</a>
                <a href="https://discord.gg/tVzp7sYgv" target="_blank" class="text-zinc-400 hover:text-white transition-colors">DISCORD</a>
                <a href="#" class="text-zinc-400 hover:text-white transition-colors">Újdonságok</a>
                <a href="#" class="text-zinc-400 hover:text-white transition-colors">Felhasználók</a>
            </nav>

            <div class="flex items-center gap-4 mt-2 md:mt-0 text-sm">
                <span class="text-white">Elo2009</span>
                <span class="cursor-pointer text-zinc-400 hover:text-white">✉</span>
                <span class="cursor-pointer text-zinc-400 hover:text-white">🔔</span>
            </div>
        </div>
    </header>

    <!-- Fő tartalom -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12 gap-4">
        
        <!-- BEJELENTKEZÉS NÉZET -->
        <div id="login-view" class="w-full max-w-4xl flex flex-col gap-4">
            <div class="w-full">
                <form onsubmit="handleLogin(event)">
                    <div class="bg-gradient-to-br from-[#27151a] via-[#1c1c24] to-[#161a29] border border-[#3b2530] rounded overflow-hidden shadow-2xl">
                        <div class="p-8 space-y-5">
                            <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-4">
                                <label class="text-xs text-zinc-300 md:text-right pr-2">Felhasználónév vagy e-mail cím:</label>
                                <input type="text" class="md:col-span-3 bg-[#13151b] text-white border border-[#31232d] rounded px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-4">
                                <label class="text-xs text-zinc-300 md:text-right pr-2">Jelszó:</label>
                                <div class="md:col-span-3 relative">
                                    <input type="password" class="w-full bg-[#13151b] text-white border border-[#31232d] rounded px-3 py-2 text-xs focus:outline-none focus:border-emerald-500 pr-14">
                                    <button type="button" class="absolute right-1.5 top-1/2 -translate-y-1/2 text-[10px] text-zinc-300 bg-[#2d2232] hover:bg-[#3d2f44] px-2 py-1 rounded">Mutat</button>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-4">
                                <div></div>
                                <div class="md:col-span-3">
                                    <a href="#" class="text-[11px] text-[#42b883] hover:underline">Elfelejtette a jelszavát?</a>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-4 pt-1">
                                <div></div>
                                <div class="md:col-span-3 flex items-center gap-2">
                                    <input type="checkbox" id="maradjBej" class="rounded bg-[#13151b] border-[#31232d] text-emerald-600 focus:ring-0 w-4 h-4">
                                    <label for="maradjBej" class="text-xs text-zinc-300 select-none cursor-pointer">Maradj bejelentkezve</label>
                                </div>
                            </div>
                        </div>

                        <div class="bg-[#1a141d] border-t border-[#3b2530] px-8 py-4 flex justify-between items-center">
                            <button type="button" onclick="switchView('register')" class="text-xs text-zinc-400 hover:text-white transition-colors underline cursor-pointer">
                                Nincs fiókod? Regisztrálj most
                            </button>
                            <button type="submit" class="bg-[#2bb673] hover:bg-[#249c63] text-white font-semibold px-6 py-2 rounded text-xs transition-colors shadow flex items-center gap-1.5 cursor-pointer">
                                🔒 Belépés
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- REGISZTRÁCIÓ NÉZET -->
        <div id="register-view" class="w-full max-w-4xl flex flex-col gap-4 hidden">
            <div class="w-full">
                <form onsubmit="handleRegister(event)">
                    <div class="bg-gradient-to-br from-[#27151a] via-[#1c1c24] to-[#161a29] border border-[#3b2530] rounded overflow-hidden shadow-2xl">
                        
                        <div class="bg-[#1a141d] border-b border-[#3b2530] px-8 py-4">
                            <h2 class="text-white text-sm font-semibold">Regisztráció</h2>
                        </div>

                        <div class="p-8 space-y-5">
                            <div class="grid grid-cols-1 md:grid-cols-4 items-start gap-4">
                                <label class="text-xs text-zinc-300 md:text-right pr-2 pt-2">Felhasználónév:<br><span class="text-[10px] text-zinc-500">Szükséges</span></label>
                                <div class="md:col-span-3 space-y-1">
                                    <input type="text" class="w-full bg-[#13151b] text-white border border-[#31232d] rounded px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                                    <p class="text-[11px] text-zinc-400">Ez a név fog megjelentni az üzeneteidnél. Ésszerű keretek között bármilyen neved lehet.</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 items-start gap-4">
                                <label class="text-xs text-zinc-300 md:text-right pr-2 pt-2">E-mail:<br><span class="text-[10px] text-zinc-500">Szükséges</span></label>
                                <div class="md:col-span-3">
                                    <input type="email" class="w-full bg-[#13151b] text-white border border-[#31232d] rounded px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 items-start gap-4">
                                <label class="text-xs text-zinc-300 md:text-right pr-2 pt-2">Jelszó:<br><span class="text-[10px] text-zinc-500">Szükséges</span></label>
                                <div class="md:col-span-3 space-y-1">
                                    <div class="relative">
                                        <input type="password" class="w-full bg-[#13151b] text-white border border-[#31232d] rounded px-3 py-2 text-xs focus:outline-none focus:border-emerald-500 pr-14">
                                        <button type="button" class="absolute right-1.5 top-1/2 -translate-y-1/2 text-[10px] text-zinc-300 bg-[#2d2232] hover:bg-[#3d2f44] px-2 py-1 rounded">Mutat</button>
                                    </div>
                                    <p class="text-[11px] text-zinc-400">Jelszó bevitele szükséges.</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-4 pt-1">
                                <div></div>
                                <div class="md:col-span-3 flex items-center gap-2">
                                    <input type="checkbox" id="feltetelek" class="rounded bg-[#13151b] border-[#31232d] text-emerald-600 focus:ring-0 w-4 h-4">
                                    <label for="feltetelek" class="text-xs text-zinc-300 select-none cursor-pointer">
                                        A regisztrációjával elfogadja a <a href="#" class="text-[#42b883] hover:underline">felhasználási feltételeket</a> és <a href="#" class="text-[#42b883] hover:underline">adatvédelmi irányelveket</a>.
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="bg-[#1a141d] border-t border-[#3b2530] px-8 py-4 flex justify-between items-center">
                            <button type="button" onclick="switchView('login')" class="text-xs text-zinc-400 hover:text-white transition-colors underline cursor-pointer">
                                Már van fiókod? Belépés
                            </button>
                            <button type="submit" class="bg-[#2bb673] hover:bg-[#249c63] text-white font-semibold px-6 py-2 rounded text-xs transition-colors shadow cursor-pointer">
                                Regisztráció
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </div>

        <!-- FÓRUM NÉZET -->
        <div id="forum-view" class="w-full max-w-7xl hidden">
            <div class="bg-gradient-to-br from-[#27151a] via-[#1c1c24] to-[#161a29] border border-[#3b2530] rounded shadow-xl p-8 text-center text-zinc-400 text-xs">
                Itt még nincs semmi. Innen építjük tovább a fórumot!
            </div>
        </div>

    </main>

    <!-- JavaScript -->
    <script>
        function switchView(view) {
            const loginView = document.getElementById('login-view');
            const registerView = document.getElementById('register-view');
            const forumView = document.getElementById('forum-view');

            loginView.classList.add('hidden');
            registerView.classList.add('hidden');
            forumView.classList.add('hidden');

            if (view === 'register') {
                registerView.classList.remove('hidden');
            } else if (view === 'login') {
                loginView.classList.remove('hidden');
            } else if (view === 'forum') {
                forumView.classList.remove('hidden');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            switchView('forum');
        }

        function handleRegister(event) {
            event.preventDefault();
            switchView('forum');
        }
    </script>

</body>
</html>
