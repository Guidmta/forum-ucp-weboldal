<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Fórum</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#2a1215] via-[#181a1f] to-[#111827] text-[#c9d1d9] font-sans min-h-screen flex flex-col justify-between">

    <!-- Felső navigációs sáv -->
    <header class="bg-[#1b1d23] border-b border-[#2b2d35] px-6 py-3 flex flex-wrap justify-between items-center shadow-md">
        <div class="flex items-center gap-8">
            <!-- Logó és Név -->
            <a href="index.html" class="flex items-center gap-2.5 font-bold text-white text-base tracking-wide">
                <img src="logo.png" alt="SEELMTA Logo" class="w-6 h-6 object-contain">
                <span>SEELMTA</span>
            </a>
            
            <!-- Menüpontok -->
            <nav class="hidden md:flex items-center gap-6 text-xs font-semibold tracking-wider">
                <a href="forum.html" class="text-white hover:text-emerald-400 transition-colors">FÓRUM</a>
                <a href="ucp.html" class="text-zinc-400 hover:text-white transition-colors">UCP</a>
                <a href="https://discord.gg/tVzp7sYgv" target="_blank" class="text-zinc-400 hover:text-white transition-colors">DISCORD</a>
            </nav>
        </div>

        <div>
            <a href="#" class="bg-[#21262d] hover:bg-[#30363d] text-zinc-200 text-xs font-semibold px-4 py-2 rounded border border-[#30363d] transition-colors flex items-center gap-1.5">
                <span>👤</span> Regisztráció
            </a>
        </div>
    </header>

    <!-- Fő tartalom: Szélesebb, kitöltöttebb doboz középre igazítva -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-4xl">
            <form>
                <div class="bg-[#2b2d35] border border-[#3a3d46] rounded overflow-hidden shadow-2xl">
                    
                    <div class="p-8 space-y-5">
                        <!-- Felhasználónév mező -->
                        <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-4">
                            <label class="text-xs text-zinc-300 md:text-right pr-2">Felhasználónév vagy e-mail cím:</label>
                            <input type="text" class="md:col-span-3 bg-[#1b1d23] text-white border border-[#3a3d46] rounded px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                        </div>

                        <!-- Jelszó mező -->
                        <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-4">
                            <label class="text-xs text-zinc-300 md:text-right pr-2">Jelszó:</label>
                            <div class="md:col-span-3 relative">
                                <input type="password" class="w-full bg-[#1b1d23] text-white border border-[#3a3d46] rounded px-3 py-2 text-xs focus:outline-none focus:border-emerald-500 pr-14">
                                <button type="button" class="absolute right-1.5 top-1/2 -translate-y-1/2 text-[10px] text-zinc-300 bg-[#3a3d46] hover:bg-[#4a4d56] px-2 py-1 rounded">Mutat</button>
                            </div>
                        </div>

                        <!-- Elfelejtette a jelszavát -->
                        <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-4">
                            <div></div>
                            <div class="md:col-span-3">
                                <a href="#" class="text-[11px] text-[#42b883] hover:underline">Elfelejtette a jelszavát?</a>
                            </div>
                        </div>

                        <!-- Maradj bejelentkezve -->
                        <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-4 pt-1">
                            <div></div>
                            <div class="md:col-span-3 flex items-center gap-2">
                                <input type="checkbox" id="maradjBej" class="rounded bg-[#1b1d23] border-[#3a3d46] text-emerald-600 focus:ring-0 w-4 h-4">
                                <label for="maradjBej" class="text-xs text-zinc-300 select-none cursor-pointer">Maradj bejelentkezve</label>
                            </div>
                        </div>
                    </div>

                    <!-- Alsó sáv a gombbal -->
                    <div class="bg-[#21232b] border-t border-[#3a3d46] px-8 py-4 flex justify-center">
                        <button type="submit" class="bg-[#2bb673] hover:bg-[#249c63] text-white font-semibold px-6 py-2 rounded text-xs transition-colors shadow flex items-center gap-1.5">
                            🔒 Belépés
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </main>

</body>
</html>
